<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Gibran Alfi Ananta | Portfolio</title>
    <meta name="description" content="Personal portfolio of a Full Stack Developer focusing on Backend Development with an interest in Data Analytics." />
    
    <!-- Preconnect for external Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gibran Alfi Ananta | Portfolio" />
    <meta property="og:description" content="Personal portfolio of a Full Stack Developer focusing on Backend Development with an interest in Data Analytics." />
    <meta property="og:image" content="https://gibranslf.github.io/Portfolio/logo.png" />
    <meta property="og:image:type" content="image/png" />

    <!-- Critical instant dark-canvas styling to eliminate white flash on refresh -->
    <style>
      :root {
        color-scheme: dark;
      }
      html.dark,
      html.dark body {
        background-color: #121212 !important;
        color: #ededed !important;
      }
      html:not(.dark),
      html:not(.dark) body {
        background-color: #ffffff !important;
        color: #171717 !important;
      }
    </style>

    <!-- Anti-flash inline script for dark/light theme -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('portfolio-theme') || 'dark'
          const isDark = theme === 'dark'
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
