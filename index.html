<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Stack Developer | Portfolio</title>
    <meta name="description" content="Personal portfolio of a Full Stack Developer focusing on Backend Development with an interest in Data Analytics." />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Full Stack Developer | Portfolio" />
    <meta property="og:description" content="Personal portfolio of a Full Stack Developer focusing on Backend Development with an interest in Data Analytics." />

    <!-- Anti-flash inline script for dark/light theme -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('portfolio-theme') || 'dark'
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
          } else {
            document.documentElement.classList.remove('dark')
          }
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
